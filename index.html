<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a"><title>NOVA AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080a;color:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
.app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column}
header{text-align:center;padding:28px 18px 14px;position:sticky;top:0;background:#08080ae8;backdrop-filter:blur(18px);z-index:2}
.logo{width:66px;height:66px;margin:auto;border-radius:22px;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#777);color:#111;font-weight:900;font-size:26px;box-shadow:0 8px 35px #fff2}
h1{font-size:25px;margin:9px 0 2px}.status{font-size:12px;color:#999}
main{flex:1;padding:10px 15px 130px}.welcome{text-align:center;color:#999;margin-top:22vh;line-height:2}.welcome strong{color:#fff}
.msg{display:flex;margin:10px 0}.msg.user{justify-content:flex-start}.msg.ai{justify-content:flex-end}.bubble{max-width:84%;padding:12px 15px;border-radius:18px;line-height:1.75;white-space:pre-wrap}.user .bubble{background:#252529}.ai .bubble{background:#141417;border:1px solid #29292e}
.composer{position:fixed;bottom:0;left:0;right:0;padding:10px max(12px,calc((100vw - 760px)/2 + 12px)) 22px;background:#08080af5;backdrop-filter:blur(18px)}
.row{display:flex;gap:7px;background:#18181b;border:1px solid #303036;border-radius:22px;padding:7px}
textarea{flex:1;background:none;border:0;outline:0;color:#fff;resize:none;font:inherit;padding:10px;max-height:110px}
button{width:46px;height:46px;border:0;border-radius:17px;background:#f4f4f5;color:#111;font-size:19px}button.secondary{background:#27272b;color:#fff}button:disabled{opacity:.5}
.note{text-align:center;color:#666;font-size:10px;margin-top:6px}
</style>
</head>
<body><div class="app">
<header><div class="logo">N</div><h1>NOVA</h1><div class="status" id="status">AI آنلاین</div></header>
<main id="chat"><div class="welcome"><strong>سلام، من NOVA هستم.</strong><br>با من فارسی صحبت کن یا پیامت را بنویس.</div></main>
<div class="composer"><div class="row">
<button id="mic" class="secondary">🎙️</button><textarea id="input" rows="1" placeholder="پیامت را بنویس..."></textarea><button id="send">➤</button>
</div><div class="note">کلید API فقط روی سرور نگهداری می‌شود.</div></div>
</div>
<script>
const chat=document.getElementById("chat"),input=document.getElementById("input"),send=document.getElementById("send"),mic=document.getElementById("mic"),status=document.getElementById("status");
const history=[];
function add(text,who){document.querySelector(".welcome")?.remove();let m=document.createElement("div");m.className="msg "+who;let b=document.createElement("div");b.className="bubble";b.textContent=text;m.appendChild(b);chat.appendChild(m);window.scrollTo(0,document.body.scrollHeight)}
async function speak(text){try{const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});if(!r.ok)return;const u=URL.createObjectURL(await r.blob());const a=new Audio(u);await a.play();}catch(e){}}
async function ask(text){add(text,"user");history.push({role:"user",content:text});status.textContent="در حال فکر کردن…";send.disabled=true;try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});const d=await r.json();if(!r.ok)throw Error(d.error);add(d.text,"ai");history.push({role:"assistant",content:d.text});speak(d.text);status.textContent="AI آنلاین"}catch(e){add("اتصال به NOVA برقرار نشد. تنظیمات سرور و API Key را بررسی کن.","ai");status.textContent="خطا در اتصال"}finally{send.disabled=false}}
send.onclick=()=>{let t=input.value.trim();if(t){input.value="";ask(t)}};
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.click()}});
let recorder, chunks=[];
mic.onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){alert("مرورگر اجازه ضبط صدا نمی‌دهد.");return}if(recorder?.state==="recording"){recorder.stop();return}
try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);chunks=[];recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());mic.textContent="🎙️";status.textContent="در حال تبدیل صدا…";let blob=new Blob(chunks,{type:"audio/webm"});let fd=new FormData();fd.append("audio",blob,"nova.webm");try{let r=await fetch("/api/transcribe",{method:"POST",body:fd});let d=await r.json();if(d.text){input.value=d.text;ask(d.text)}else throw Error()}catch(e){status.textContent="خطا در تبدیل صدا"}};recorder.start();mic.textContent="⏹️";status.textContent="در حال گوش دادن…"}catch(e){alert("اجازه میکروفون داده نشد.")}};
</script></body></html>
